name: Update EPG XML

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compressed EPG file
        run: |
          curl -L -o epg_ripper_UK1.xml.gz \
            "https://epgshare01.online/epgshare01/epg_ripper_UK1.xml.gz"

      - name: Unzip the file
        run: |
          gunzip -c epg_ripper_UK1.xml.gz > epg_ripper_UK1.xml

      - name: Filter to selected channels
        run: python3 filter_epg.py

      - name: Commit and push if changes exist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add epg_ripper_UK1.xml
          git commit -m "Automated EPG update $(date -u +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push
